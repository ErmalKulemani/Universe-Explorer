<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Universe Explorer</title>

  <link rel="stylesheet" href="style.css">

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

  <div id="interface">

    <header>
      <div class="logo">
        🌌 UNIVERSE EXPLORER
      </div>

      <input
        id="search"
        type="text"
        placeholder="Search the Universe..."
      >

      <button id="explore">
        🚀 Explore
      </button>
    </header>

    <div id="breadcrumb">
      Universe → Milky Way → Solar System
    </div>

    <div id="scale">
      SOLAR SYSTEM
    </div>

    <div id="hint">
      Drag to rotate • Scroll to zoom • Click an object
    </div>

  </div>

  <div id="info-panel"></div>

  <script src="script.js"></script>

</body>
</html>
